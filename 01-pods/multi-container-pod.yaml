apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  namespace: roboshop
spec:
  containers:
    - name: nginx
      image: nginx:1.24
      ports:
        - containerPort: 80
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/nginx

    - name: log-agent
      image: busybox
      command: ["sleep", "1000"]
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/nginx

  volumes:
    - name: log-volume
      emptyDir: {}
