apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mysql

  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: mysql

    spec:
      serviceAccountName: mysql-secret-reader # ✅ corrected field name

      initContainers:
        - name: secret-reader
          image: amazon/aws-cli

          command:
            - sh
            - -c
            - |
              echo "Fetching secret from AWS Secrets Manager..."

              aws secretsmanager get-secret-value \
                --region us-east-1 \
                --secret-id /roboshop/dev/mysql_root_password \
                --query SecretString \
                --output text | jq -r '."/roboshop/dev/mysql_root_password"' > /secrets/mysql-secret-reader.txt

              echo "Secret placed successfully"

              # not recommended
              cat /secrets/mysql-secret-reader.txt

          volumeMounts:
            - name: mysql-secret
              mountPath: /secrets

      containers:
        - name: mysql
          image: chelloju/mysql:1.5.0

          volumeMounts:
            - name: mysql-secret
              mountPath: /secrets

      volumes:
        - name: mysql-secret
          emptyDir: {}
