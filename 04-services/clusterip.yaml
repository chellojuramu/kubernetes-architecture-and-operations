apiVersion: v1
kind: Service
metadata:
  name: cluster-svc          # name of the service — also becomes the DNS name
  labels:
    env: demo                # label on the service itself

spec:                        # specification — describe what this service should do
  type: ClusterIP            # internal only — default type, can be omitted but
  # good to write explicitly for clarity

  selector:                  # how this service finds its pods
    env: demo                # find pods that have this label
    app: nginx               # AND this label — both must match

  ports:
    - name: http             # name for this port mapping
      protocol: TCP          # protocol to use
      port: 80               # port the service listens on inside the cluster
      targetPort: http       # forwards to the container port named "http" (port 80)