apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    name: myapp-pod
spec:
  containers:
    - name: myapp-container
      image: busybox:1.28
      command: ['sh' , '-c', 'echo Hello, $FIRSTNAME! && sleep 3600']
      env:
        - name: FIRSTNAME
          value: "Ramu"
  initContainers:
    - name: wait-for-myservice
      image: busybox:1.28   # or any image that has nslookup
      args:
        - /bin/sh
        - -c
        - until nslookup myservice.default.svc.cluster.local; do echo "waiting for myservice..."; sleep 2; done
